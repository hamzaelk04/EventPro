# --- Application ---
spring.application.name=EventPro
server.port=8080

# --- DataSource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/EventPro
spring.datasource.username=postgres
spring.datasource.password=t7)rpjDb
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Pessimistic lock timeout (ms) so threads don't wait forever ---
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# --- Swagger / Springdoc ---
springdoc.swagger-ui.path=/swagger-ui.html
